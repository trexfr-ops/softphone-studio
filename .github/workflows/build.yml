name: Build PhantomLine APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhantomLine-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.7
          name: "PhantomLine Luxury OLED Black v1.0.7"
          body: |
            ### PhantomLine - Luxury OLED Black Edition v1.0.7
            Built with Jetpack Compose & Gradle on GitHub Actions.
            - 100% Genuine Polish (+48) Carrier Integration: Eliminated all mock numbers, mock regions, and synthetic reservations
            - Real-World Line Validity Extension: Direct integration with 2NR carrier switch (sms/extendNumberValidityMessage)
            - Recipient Virtual Line Attribution: Inbound SMS and voicemails explicitly tag the destination line (+48 459 193 733 / Line Name)
            - Native Android Notifications: High-priority telecom alerts with Android 13+ permission guards and initial notification storm deduplication
            - Strict Schema & Date Handling: ISO-8601 UTC timestamp parsing with dynamic lease countdown
            - Pre-filled credentials (rolledrick581@gmail.com) for instantaneous one-tap gateway authentication
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
