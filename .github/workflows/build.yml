name: Build PhantomLine APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhantomLine-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.6
          name: "PhantomLine Luxury OLED Black v1.0.6"
          body: |
            ### PhantomLine - Luxury OLED Black Edition v1.0.6
            Built with Jetpack Compose & Gradle on GitHub Actions.
            - Web-Identical Anime.js & SVG Hardware-Accelerated Startup Animation with full bloom filters (#neonGlow, #softGlow)
            - 36 radial pulsating spectrum rays, rotating reticle with cardinal ticks, orbiting photons, and elastic handset spring pop
            - Complete OLED Black UI refinement with pure branding consistency across all screens
            - Phase 1-4 Full VoIP Telecom Suite: Warsaw Gateway, OTP one-tap badge, radial lease gauge, dynamic sinusoidal reactive visualizer, and directional paging
            - Rebranded to PhantomLine (Developer: trexhausted on Discord)
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
