name: Build PhantomLine APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhantomLine-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.3
          name: "PhantomLine Luxury OLED Black v1.0.3"
          body: |
            ### PhantomLine - Luxury OLED Black Edition v1.0.3
            Built with Jetpack Compose & Gradle on GitHub Actions.
            - Brand Rebrand to PhantomLine (Developer: trexhausted on Discord)
            - Mono Luxury starting animation on app launch with rotating telemetry and pulse waves
            - First-time startup Login / Register screen automatically pops up when unauthenticated
            - Removed all mock/fake items: clean empty states for Numbers, Messages, and Voicemail
            - Smooth spring animations across dialer keypad, tab transitions (AnimatedContent), and modal dialogs
            - Direct 2NR Cloud session authentication and real Polish SMS gateway integration
            - Luxury OLED Pitch Black (#000000) theme with zero emojis
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
