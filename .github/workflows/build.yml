name: Build PhantomLine APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhantomLine-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.5
          name: "PhantomLine Luxury OLED Black v1.0.5"
          body: |
            ### PhantomLine - Luxury OLED Black Edition v1.0.5
            Built with Jetpack Compose & Gradle on GitHub Actions.
            - Phase 1: Fluid Rolling Digit Stream, tactile mechanical haptic pulses, and breathing dual-ring radar aura on VoIP Call trigger
            - Phase 2: Warsaw Gateway Metallic Shimmer Loading Skeletons, Radial Lease Gauge countdown rings on virtual numbers, and One-Tap OTP verification extraction chips
            - Phase 3: Dynamic 48kHz Sinusoidal Reactive Waveform Visualizer with liquid phase physics and animated audio playback speed pills
            - Phase 4: Flagship Directional Screen Sliding Navigation with haptic feedback and orbital avatar pulse waves during active VoIP calls
            - Rebranded to PhantomLine (Developer: trexhausted on Discord)
            - Pure Pitch Black (#000000) OLED luxury design with zero emojis
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
