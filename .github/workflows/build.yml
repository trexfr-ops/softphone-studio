name: Build PhantomLine APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhantomLine-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.4
          name: "PhantomLine Luxury OLED Black v1.0.4"
          body: |
            ### PhantomLine - Luxury OLED Black Edition v1.0.4
            Built with Jetpack Compose & Gradle on GitHub Actions.
            - New Official App Launcher Icons rendered directly from the high-res Mono Luxury vector SVG
            - Persistent Authentication: saved in SharedPreferences so session persists across app restarts
            - Web-style Intro Animation: wireframe path drawing and elastic spring handset centerpiece reveal
            - Butter-smooth continuous loading bar interpolation and gliding status telemetry transitions
            - Rebrand to PhantomLine (Developer: trexhausted on Discord)
            - Direct Polish 2NR VoIP and SMS Gateway integration
            - Pitch Black (#000000) OLED theme with zero emojis
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
