name: Build Softphone Studio APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoftphoneStudio-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.2
          name: "Softphone Studio OLED Black v1.0.2"
          body: |
            ### Softphone Studio - Luxury OLED Black Edition v1.0.2
            Official clean Android APK built with Jetpack Compose & Gradle on GitHub Actions.
            - Brand New Mono Luxury Starting / Splash Animation on app launch with rotating telemetry and pulse waves
            - Fixed 2NR Cloud session authentication: properly extracts session token from Set-Cookie headers
            - Fixed 2NR SMS inbox parsing: parses live verification/security codes (Discord, Instagram, Facebook, etc.)
            - Fixed virtual numbers list parsing from 2NR pool
            - Luxury OLED Pitch Black (#000000) theme with zero emojis
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
